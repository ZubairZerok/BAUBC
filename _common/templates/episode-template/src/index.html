<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><title>BAUBC · episode template</title>
<link rel="stylesheet" href="../../../brand/brand.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:var(--ink);color:var(--cream);overflow:hidden}
h1{position:absolute;left:0;right:0;top:800px;margin:0;text-align:center;font:800 130px/1.1 var(--font-bn-display)}
h1 b{color:var(--lime)}
</style></head>
<body><div id="stage"><h1>নতুন <b>এপিসোড</b></h1></div>
<script src="../../../toolkit/vendor/gsap.min.js"></script>
<script>
// Adjust the two relative paths above after copying this folder into a series.
const tl = gsap.timeline({ paused: true }), cues = [];
const sfx = (t, name) => cues.push({ t, name });
tl.fromTo('h1', { opacity: 0, y: 120, scale: .8 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'back.out(1.7)' }, .2); sfx(.2, 'whoosh');
window.__duration = 3; window.__cues = cues;
window.__seek = t => { tl.time(t, false); };
window.__ready = (async () => { await document.fonts.load('800 100px "Anek Bangla"', 'ক'); await document.fonts.ready; window.__seek(0); })();
</script></body></html>
