<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CASE STUDIES — logo animation v2</title>
<link rel="stylesheet" href="../../../_common/brand/brand.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:#050604;overflow:hidden}
.sub{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-en-display);color:var(--cream);text-transform:uppercase;opacity:0}
#by{font-weight:700;font-size:32px;letter-spacing:.5em;text-indent:.5em;color:var(--lime)}
#full{font-weight:500;font-size:18px;letter-spacing:.26em;color:var(--cream-dim)}
#rule{position:absolute;left:340px;width:400px;height:3px;background:var(--lime);transform:scaleX(0)}
</style></head>
<body><div id="stage"></div>
<script src="../../../_common/toolkit/vendor/gsap.min.js"></script>
<script src="../../../_common/brand/baubc-mark.js"></script>
<script src="logo.js"></script>
<script>
window.__duration = 7.5;
window.__ready = (async () => {
  await Promise.all(['900 100px Unbounded', '700 30px Unbounded', '500 17px Unbounded'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  const L = buildCaseStudiesLogo(document.getElementById('stage'), { width: 900, cy: 880 });
  L.sub.innerHTML = `<div id="rule" style="top:${L.bottom + 80}px"></div><div class="sub" id="by" style="top:${L.bottom + 112}px">A BAUBC SERIES</div><div class="sub" id="full" style="top:${L.bottom + 172}px">Bangladesh Agricultural University Business Club</div>`;
  const tl = gsap.timeline({ paused: true }).add(L.timeline, 0);
  tl.to('#rule', { scaleX: 1, duration: 0.6, ease: 'expo.out' }, 3.3)
    .fromTo('#by', { opacity: 0, letterSpacing: '1.4em' }, { opacity: 1, letterSpacing: '.5em', duration: 0.8, ease: 'expo.out' }, 3.4)
    .fromTo('#full', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6 }, 3.7).to({}, { duration: 0.01 }, 7.5);
  window.__cues = L.cues;
  window.__seek = t => { tl.time(Math.min(t, 7.5), false); L.draw(t); };
  window.__seek(0);
})();
</script></body></html>
