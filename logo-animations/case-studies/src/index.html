<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CASE STUDIES — logo animation</title>
<link rel="stylesheet" href="../../../_common/brand/brand.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:radial-gradient(ellipse 80% 50% at 50% 50%,#12160b 0%,var(--ink) 70%);overflow:hidden}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(239,233,220,.11) 1.5px,transparent 2px);background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse 70% 45% at 50% 50%,#000,transparent);mask-image:radial-gradient(ellipse 70% 45% at 50% 50%,#000,transparent)}
#holder{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.sub{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-en-display);color:var(--cream);text-transform:uppercase}
#by{top:1236px;font-weight:700;font-size:30px;letter-spacing:.5em;color:var(--lime)}
#full{top:1296px;font-weight:500;font-size:17px;letter-spacing:.3em;color:var(--cream-dim)}
#rule{position:absolute;left:340px;top:1200px;width:400px;height:3px;background:var(--lime);transform-origin:50% 50%}
</style></head>
<body><div id="stage"><div id="grid"></div><div id="holder"></div>
<div id="rule"></div><div class="sub" id="by">A BAUBC SERIES</div><div class="sub" id="full">Bangladesh Agricultural University Business Club</div></div>
<script src="../../../_common/toolkit/vendor/gsap.min.js"></script>
<script src="logo.js"></script>
<script>
window.__duration = 6;
window.__ready = (async () => {
  await Promise.all(['900 100px Unbounded','700 30px Unbounded','500 17px Unbounded'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  const logo = buildCaseStudiesLogo(document.getElementById('holder'), { width: 900 });
  const tl = gsap.timeline({ paused: true });
  tl.add(logo.timeline, 0.3);
  tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'expo.out' }, 2.7)
    .fromTo('#by', { opacity: 0, letterSpacing: '1.4em' }, { opacity: 1, letterSpacing: '.5em', duration: 0.8, ease: 'expo.out' }, 2.8)
    .fromTo('#full', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 3.1)
    .fromTo('#grid', { opacity: 0 }, { opacity: 1, duration: 1.2 }, 0.9);
  window.__cues = logo.cues.map(c => ({ ...c, t: c.t + 0.3 }));
  window.__seek = t => tl.time(Math.min(t, window.__duration), false);
  window.__seek(0);
})();
</script></body></html>
